<script src="index.js"></script><script>
const requestedLanguage=new URLSearchParams(location.search).get('lang');const fr=requestedLanguage==='fr',$=id=>document.getElementById(id);document.documentElement.lang=fr?'fr':'en';
const text=fr?{eyebrow:'LA CASSE · DÉMO',load:'Chargement…',slow:'La démo est plus fluide sur ordinateur.',failed:'Impossible de démarrer la démo',lost:'Détruit',won:'Niveau gagné',machines:'machines détruites',level:'niveau',pitch:'Le jeu complet arrive sur Steam, avec d’autres serpents et d’autres armes, des succès Steam, un garage qui garde ta progression, et de nouveaux niveaux au fil des mises à jour.',steam:'Ajouter à ma liste de souhaits ↗',replay:'Rejouer',caption:'Images du jeu complet',soundOff:'Son de la vidéo : coupé',soundOn:'Son de la vidéo : activé',video:'showcase-fr.mp4'}:{eyebrow:'THE SCRAPYARD · DEMO',load:'Loading…',slow:'The demo runs more smoothly on a computer.',failed:'Unable to start the demo',lost:'Wrecked',won:'Level cleared',machines:'machines destroyed',level:'level',pitch:'The full game is coming to Steam, with more snakes and weapons, Steam achievements, a garage that keeps your progress, and new stages through its updates.',steam:'Add to your wishlist ↗',replay:'Play again',caption:'Footage from the full game',soundOff:'Video sound: off',soundOn:'Video sound: on',video:'showcase.mp4'};
// The demo speaks English unless the page asks for French (?lang=fr).

const azerty=/^fr(-(fr|be|lu|mc))?$/i.test(navigator.language);const keyLabels=azerty?{W:'Z',A:'Q',S:'S',D:'D'}:{W:'W',A:'A',S:'S',D:'D'};
function showKeys(){const letters=keyLabels.W+keyLabels.A+keyLabels.S+keyLabels.D;$('keys').textContent=fr?`Flèches ou ${letters} · Les armes tirent toutes seules · Échap : pause`:`Arrow keys or ${letters} · Weapons fire on their own · Esc: pause`}
try{navigator.keyboard?.getLayoutMap?.().then(map=>{for(const key in keyLabels){const value=map.get('Key'+key);if(value&&/^\p{L}$/u.test(value))keyLabels[key]=value.toUpperCase()}showKeys()}).catch(()=>{})}catch{}
$('overline').textContent=text.eyebrow;$('loadlabel').textContent=text.load;$('pitch').textContent=text.pitch;$('steam').textContent=text.steam;$('replay').textContent=text.replay;$('caption').textContent=text.caption;$('sound').textContent=text.soundOff;showKeys();
// Steam's UTM report: where the demo is played (itch.io, Rogue Paradigm or another host) and from which button.
const topOrigin=location.ancestorOrigins?.length?location.ancestorOrigins[location.ancestorOrigins.length-1]:(document.referrer?new URL(document.referrer).origin:location.origin);
const playedOn=/(^|\.)itch\.(io|zone)$/.test(new URL(topOrigin).hostname)||/(^|\.)itch\.zone$/.test(location.hostname)?'itch.io':new URL(topOrigin).hostname.replace(/^www\./,'')||'direct';
const steamUrl=content=>`https://store.steampowered.com/app/5236670/COILBREAKER/?utm_source=${encodeURIComponent(playedOn)}&utm_medium=web_demo&utm_campaign=coilbreaker_demo&utm_content=${content}`;
const clock=seconds=>`${Math.floor(seconds/60).toString().padStart(2,'0')}:${Math.floor(seconds%60).toString().padStart(2,'0')}`;
const post=(type,status)=>{if(parent!==window)parent.postMessage({type,status},location.origin)};
let ended=false,replayCheck=0;
// Phones and tablets get the game's low quality (scripts/promo/demo_settings.gd); ?quality=low or ?quality=normal forces it.
const requestedQuality=new URLSearchParams(location.search).get('quality');const quality=['low','normal'].includes(requestedQuality)?requestedQuality:(matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches?'low':'normal');
// Phones and tablets that stay slow even at 30 steps a second (scripts/promo/demo_main.gd): one line, once, that goes away.
const touchDevice=matchMedia('(pointer: coarse)').matches&&!matchMedia('(pointer: fine)').matches;let slowTimer=0;
function hideSlow(){clearTimeout(slowTimer);$('slow').hidden=true}
window.CoilDemo={language:fr?'fr':'en',keys:keyLabels,steamUrl,quality,status:null,onStatus(s){this.status=s;post('coilbreaker:status',s)},onSlowDevice(){if(!touchDevice||ended)return;$('slow').textContent=text.slow;$('slow').hidden=false;post('coilbreaker:slow',this.status);slowTimer=setTimeout(hideSlow,8000)},onDefeat(s){if(ended)return;ended=true;hideSlow();this.status=s;post('coilbreaker:defeat',s);$('endtitle').textContent=s.won?text.won:text.lost;$('score').textContent=`${clock(s.seconds)} · ${s.kills} ${text.machines} · ${text.level} ${s.level}`;$('steam').href=steamUrl('end_screen');const v=$('showcase');v.muted=true;$('sound').textContent=text.soundOff;v.src=text.video;v.play().catch(()=>{});$('end').hidden=false;$('steam').focus()}};
// Play again starts a new run inside the engine (scripts/promo/demo_main.gd); reloading stays the fallback.
$('replay').onclick=()=>{ended=false;const v=$('showcase');v.pause();v.removeAttribute('src');v.load();$('end').hidden=true;$('canvas').focus();window.dispatchEvent(new Event('coilbreaker-replay'));clearTimeout(replayCheck);replayCheck=setTimeout(()=>{if(!window.CoilDemo.status||window.CoilDemo.status.state==='lost')location.reload()},2000)};
// The engine listens on the canvas: when the page hands the keyboard back to this frame, give it to the canvas.
window.addEventListener('focus',()=>{if($('end').hidden&&$('loading').hidden)$('canvas').focus()});
// ?perf=1: what a frame costs on this device, to tell the engine's work (process, physics: the processor) from the
// rest (the graphics chip, the browser) when the frames are fewer than the work explains.
if(new URLSearchParams(location.search).get('perf')==='1'){const box=$('perf');box.hidden=false;let frames=0,last=performance.now();(function count(){frames++;requestAnimationFrame(count)})();setInterval(()=>{const now=performance.now(),rate=frames*1000/(now-last);frames=0;last=now;const p=window.CoilDemo.status?.perf;if(!p)return;box.textContent=`${rate.toFixed(0)} images/s · ${(1000/Math.max(rate,1)).toFixed(0)} ms par image
process ${p.process_ms.toFixed(1)} ms · physique ${p.physics_ms.toFixed(1)} ms
${p.steps} pas/s · qualité ${p.low?'basse':'normale'}${p.lighter?' · allégée '+p.lighter:''} · ${p.draw_calls} appels de dessin
${screen.width}×${screen.height} @${devicePixelRatio} · canvas ${$('canvas').width}×${$('canvas').height}`},1000)}
$('slow').onclick=()=>{hideSlow();$('canvas').focus()};
$('sound').onclick=()=>{const v=$('showcase');v.muted=!v.muted;$('sound').textContent=v.muted?text.soundOff:text.soundOn};
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":55467544,"index.wasm":1509558},"focusCanvas":true,"gdextensionLibs":["coilbreaker_native.web.template_release.wasm32.nothreads.wasm"],"godotPoolSize":4});const missing=Engine.getMissingFeatures({threads:false});function failed(e){$('error').hidden=false;$('error').textContent=String(e);$('loadlabel').textContent=text.failed}
if(missing.length)failed(missing.join(', '));else engine.startGame({onProgress(c,t){if(t>0){$('progress').max=t;$('progress').value=c}}}).then(()=>{$('loading').hidden=true;$('canvas').focus()}).catch(failed);
</script></body></html>
